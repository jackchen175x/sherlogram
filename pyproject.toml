[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlogram"
version = "1.0.0"
description = "Sherlock for Telegram: an MCP server that lets AI work your Telegram account and trace grey-market supply chains to the source"
readme = "README.md"
authors = [
    {name = "chigwell"},
    {name = "l1v0n1"}
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.8.0",
    "nest-asyncio>=1.6.0",
    "python-dotenv>=1.1.0",
    "python-json-logger>=3.3.0",
    "telethon>=1.42.0",
]

[project.urls]
"Homepage" = "https://github.com/jackchen175x/sherlogram"
"Bug Tracker" = "https://github.com/jackchen175x/sherlogram/issues"

[tool.setuptools]
packages = ["tg_mcp"]
py-modules = ["main"]

[project.scripts]
sherlogram = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 99
target-version = ['py311']

[tool.flake8]
ignore = ["E203", "E501", "W503"]
max-line-length = 99
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "docs/source/conf.py",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
